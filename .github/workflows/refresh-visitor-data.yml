name: Refresh visitor map data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh_visitor_data.py'
      - '.github/workflows/refresh-visitor-data.yml'

permissions:
  contents: write

concurrency:
  group: visitor-map-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Update the visitor data branch
        env:
          DATA_REF: refs/heads/codex/visitor-data
        run: |
          git fetch --no-tags --depth=1 origin "$DATA_REF"
          data_dir=$(mktemp -d "$RUNNER_TEMP/visitor-data.XXXXXX")
          git show FETCH_HEAD:visitor-data.json > "$data_dir/previous.json"
          python3 .github/scripts/refresh_visitor_data.py "$data_dir/visitor-data.json" \
            --previous "$data_dir/previous.json"
          test -f "$data_dir/visitor-data.json" || exit 0

          git switch --detach FETCH_HEAD
          cp "$data_dir/visitor-data.json" visitor-data.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- visitor-data.json
          git commit -m 'Refresh visitor map data'
          git push origin "HEAD:$DATA_REF"
