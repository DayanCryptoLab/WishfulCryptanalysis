<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 414" role="img" aria-labelledby="title desc">
  <title id="title">Tianwen Agent architecture</title>
  <desc id="desc">The coordinator starts with the task configuration and schedules specialists. The web dashboard sends guidance and reads shared records. Specialists post updates, call the model API, and submit candidates for independent verification. Failed checks can inform a revision.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    rect { fill: #fff; stroke: #c5d3cb; stroke-width: 1.5; }
    .surface { fill: #f6f8f5; }
    .provider { fill: #eaf1f7; stroke: #bacbd9; }
    .verifier { fill: #e6f2ea; stroke: #8bb69d; }
    .records { fill: #edf2ed; }
    .label { fill: #192d25; font-size: 20px; font-weight: 650; }
    .detail { fill: #465e53; font-size: 13px; }
    .flow { fill: none; stroke: #446659; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .feedback { stroke: #48768b; stroke-dasharray: 5 5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#446659"/>
    </marker>
  </defs>
  <rect class="surface" x="1" y="1" width="998" height="412" rx="20"/>
  <g class="flow" marker-end="url(#arrow)">
    <path d="M257 177H270"/>
    <path d="M493 177H506"/>
    <path d="M729 177H742"/>
    <path d="M382 86V122"/>
    <path d="M618 86V122" marker-start="url(#arrow)"/>
    <path d="M147 322V231"/>
    <path d="M382 229V322"/>
    <path d="M540 229V322"/>
    <path d="M918 229V322"/>
    <path class="feedback" d="M850 229V275H618V232"/>
  </g>
  <rect x="272" y="27" width="220" height="55" rx="10"/>
  <text class="label" x="382" y="62">Task configuration</text>
  <rect class="provider" x="508" y="27" width="220" height="55" rx="10"/>
  <text class="label" x="618" y="62">Model API</text>
  <rect x="36" y="127" width="220" height="100" rx="12"/>
  <text class="label" x="146" y="169">Web dashboard</text>
  <text class="detail" x="146" y="195">Send guidance · View results</text>
  <rect x="272" y="127" width="220" height="100" rx="12"/>
  <text class="label" x="382" y="169">Coordinator</text>
  <text class="detail" x="382" y="195">Assign work · Manage queue</text>
  <rect x="508" y="127" width="220" height="100" rx="12"/>
  <text class="label" x="618" y="169">Specialists</text>
  <text class="detail" x="618" y="195">Share progress · Submit proposals</text>
  <rect x="744" y="127" width="220" height="100" rx="12" class="verifier"/>
  <text class="label" x="854" y="169">Independent verifier</text>
  <text class="detail" x="854" y="195">Check acceptance criteria</text>
  <text class="detail" x="734" y="299">Failed checks can inform revision</text>
  <rect class="records" x="36" y="326" width="928" height="62" rx="12"/>
  <text class="label" x="500" y="352">Shared task records</text>
  <text class="detail" x="500" y="373">Messages · Task status · Verification receipts</text>
</svg>
